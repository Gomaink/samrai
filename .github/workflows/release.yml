name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build metadata
        id: meta
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          prerelease=false
          tags="$image:$version"
          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            tags="$tags"$'\n'"$image:latest"
          fi
          {
            echo "version=$version"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "image=$image"
            echo "prerelease=$prerelease"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
      - name: Create source archives
        shell: bash
        run: |
          version="${{ steps.meta.outputs.version }}"
          git archive --format=zip --prefix="samrai-v${version}/" -o "samrai-v${version}-source.zip" HEAD
          git archive --format=tar.gz --prefix="samrai-v${version}/" -o "samrai-v${version}-source.tar.gz" HEAD
          sha256sum "samrai-v${version}-source.zip" "samrai-v${version}-source.tar.gz" > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: |
            samrai-v${{ steps.meta.outputs.version }}-source.zip
            samrai-v${{ steps.meta.outputs.version }}-source.tar.gz
            SHA256SUMS.txt
